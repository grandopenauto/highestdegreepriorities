<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 840" role="img" aria-labelledby="title desc">
  <title id="title">PBK Bears collector box</title>
  <desc id="desc">Series 1 collector box mockup.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27d"/><stop offset="0.45" stop-color="#ff62d8"/><stop offset="0.8" stop-color="#54e8ff"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1731"/><stop offset="1" stop-color="#090912"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="420" height="820" rx="22" fill="url(#rim)"/>
  <rect x="28" y="28" width="384" height="784" rx="14" fill="url(#bg)"/>
  <text x="220" y="255" text-anchor="middle" fill="url(#rim)" font-family="Arial Black, sans-serif" font-size="72">PBK</text>
  <text x="220" y="326" text-anchor="middle" fill="#fff" font-family="Arial Black, sans-serif" font-size="62">BEARS</text>
  <text x="220" y="418" text-anchor="middle" fill="#ffd86d" font-family="Arial, sans-serif" font-size="26" letter-spacing="5" font-weight="700">SERIES 1</text>
  <text x="220" y="482" text-anchor="middle" fill="#ffffff" font-family="Arial Black, sans-serif" font-size="34">COLLECTOR BOX</text>
  <text x="220" y="690" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" letter-spacing="4">A BRIGHTER TOMORROW</text>
</svg>
