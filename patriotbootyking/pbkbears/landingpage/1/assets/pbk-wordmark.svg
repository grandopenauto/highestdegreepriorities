<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">PBK Bears wordmark</title>
  <desc id="desc">A glossy gradient PBK Bears logo for the landing page.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d5"/>
      <stop offset="0.25" stop-color="#ffd86d"/>
      <stop offset="0.48" stop-color="#ff5ed7"/>
      <stop offset="0.72" stop-color="#57e8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <text x="28" y="160" font-family="Arial Black, Impact, sans-serif" font-size="180" font-weight="900" fill="url(#g1)" letter-spacing="-14">PBK</text>
    <text x="42" y="312" font-family="Arial Black, Impact, sans-serif" font-size="155" font-weight="900" fill="url(#g1)" letter-spacing="-10">BEARS</text>
    <text x="53" y="368" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#ffd86d" letter-spacing="12">SERIES 1</text>
  </g>
</svg>
