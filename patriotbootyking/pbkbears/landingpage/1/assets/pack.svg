<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 860" role="img" aria-labelledby="title desc">
  <title id="title">PBK Bears foil pack</title>
  <desc id="desc">Series 1 foil trading card pack mockup.</desc>
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfffff"/><stop offset="0.18" stop-color="#ff69da"/><stop offset="0.34" stop-color="#ffe16f"/><stop offset="0.5" stop-color="#58e9ff"/><stop offset="0.68" stop-color="#9d7aff"/><stop offset="0.84" stop-color="#ffb26d"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
